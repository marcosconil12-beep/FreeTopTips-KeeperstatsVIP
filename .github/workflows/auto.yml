name: Generador Autónomo Scores24 AI

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 05:00 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Ejecutar Bot de Inteligencia Artificial
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: node generator.js

      - name: Guardar y Publicar en la Web
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "🤖 Actualización automática de pronósticos del día" || exit 0
          git push
