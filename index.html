<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keeperstats VIP - Pronósticos Deportivos</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131c2e;
      --text-color: #f1f5f9;
      --accent-color: #22c55e;
      --vip-color: #eab308;
      --border-color: #1e293b;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 20px;
      text-align: center;
    }
    h1 { color: var(--accent-color); margin: 0; font-size: 1.8em; }
    .subtitle { color: #94a3b8; font-size: 0.9em; margin-top: 5px; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      background: var(--card-bg);
      color: #94a3b8;
      font-size: 1.1em;
    }
    .tab-btn.active-free { background: var(--accent-color); color: #fff; }
    .tab-btn.active-vip { background: var(--vip-color); color: #000; }

    .pick-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 6px solid var(--accent-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .pick-card.vip { border-left-color: var(--vip-color); }
    .match-title { font-size: 1.3em; color: #38bdf8; margin-top: 0; display: flex; justify-content: space-between; }
    .league-badge { background: #1e293b; font-size: 0.75em; padding: 4px 8px; border-radius: 4px; color: #cbd5e1; }
    .analysis-box { font-size: 0.95em; line-height: 1.5; color: #cbd5e1; margin: 15px 0; }
    .footer-admin { text-align: right; margin-top: 30px; font-size: 0.85em; }
    .footer-admin a { color: #64748b; text-decoration: none; }
  </style>
</head>
<body>

<header>
  <h1>Keeperstats VIP ⚽</h1>
  <div class="subtitle">Análisis Estadísticos y Apuestas Inteligentes</div>
</header>

<div class="container">
  <div class="tabs">
    <button id="btnFree" class="tab-btn active-free" onclick="cambiarSeccion('free')">🎁 Picks Gratuitos</button>
    <button id="btnVip" class="tab-btn" onclick="cambiarSeccion('vip')">👑 Picks Privados (VIP)</button>
  </div>

  <div id="picksContainer"></div>

  <div class="footer-admin">
    <a href="admin.html">🔐 Acceso de Administrador</a>
  </div>
</div>

<script>
let seccionActual = 'free';

window.onload = function() {
  cargarPicks();
}

function cambiarSeccion(tipo) {
  seccionActual = tipo;
  document.getElementById('btnFree').className = tipo === 'free' ? 'tab-btn active-free' : 'tab-btn';
  document.getElementById('btnVip', tipo === 'vip').className = tipo === 'vip' ? 'tab-btn active-vip' : 'tab-btn';
  // Arreglar clases de botones
  if(tipo === 'free') {
    document.getElementById('btnFree').className = 'tab-btn active-free';
    document.getElementById('btnVip').className = 'tab-btn';
  } else {
    document.getElementById('btnFree').className = 'tab-btn';
    document.getElementById('btnVip').className = 'tab-btn active-vip';
  }
  cargarPicks();
}

function cargarPicks() {
  const container = document.getElementById('picksContainer');
  const storageKey = seccionActual === 'free' ? 'keeperstats_free' : 'keeperstats_vip';
  let picks = JSON.parse(localStorage.getItem(storageKey) || '[]');

  if (picks.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding: 40px; color: #64748b;">
      <h3>No hay pronósticos ${seccionActual === 'free' ? 'gratuitos' : 'VIP privados'} publicados</h3>
      <p>Entra en el panel de administración para generarlos.</p>
    </div>`;
    return;
  }

  container.innerHTML = '';
  picks.forEach(p => {
    let card = document.createElement('div');
    card.className = seccionActual === 'vip' ? 'pick-card vip' : 'pick-card';
    card.innerHTML = `
      <div class="match-title">
        <span>⚽ ${p.partido}</span>
        <span class="league-badge">${p.liga}</span>
      </div>
      <p style="color: #94a3b8; font-size: 0.85em;">📅 ${p.fecha}</p>
      <div class="analysis-box"><strong>Análisis:</strong> ${p.analisis}</div>
      <div style="background: #1e293b; padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
        <div><span style="font-size:0.8em; color:#94a3b8; display:block;">PICK</span><strong style="color: #22c55e;">${p.pick}</strong> (@${p.cuota})</div>
        <div><span style="font-size:0.8em; color:#94a3b8; display:block;">MERCADO EXTRA</span><span>${p.extra}</span></div>
        <div><span style="font-size:0.8em; color:#94a3b8; display:block;">STAKE</span><span>${p.stake}</span></div>
      </div>
    `;
    container.appendChild(card);
  });
}
</script>
</body>
</html>
