<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Generador de Picks con IA</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131c2e;
      --text-color: #f1f5f9;
      --accent-color: #22c55e;
      --border-color: #1e293b;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0b0f19;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background-color: var(--accent-color);
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:hover { background-color: #16a34a; }
    .hidden { display: none; }
    .loading { text-align: center; color: #38bdf8; display: none; font-size: 1.1em; }
    .success { color: #22c55e; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔐 Panel de Control - Administrador</h1>

  <!-- Pantalla de Login -->
  <div id="loginBox" class="card">
    <h3>Introduce tu Contraseña de Admin</h3>
    <input type="password" id="adminPass" placeholder="Contraseña secreta">
    <button onclick="verificarLogin()">Entrar al Panel</button>
  </div>

  <!-- Panel Generador -->
  <div id="adminPanel" class="card hidden">
    <h3>🤖 Generador Masivo con IA (Gemini)</h3>
    
    <label>Tu API Key de Gemini (Privada):</label>
    <input type="password" id="apiKey" placeholder="Pega tu clave API aquí">

    <label>Selecciona la Competición:</label>
    <select id="ligaSelect">
      <option value="LaLiga España">LaLiga España</option>
      <option value="LaLiga Hypermotion">LaLiga Hypermotion</option>
      <option value="Primera RFEF">Primera RFEF</option>
      <option value="Copa de España">Copa de España</option>
      <option value="Premier League">Premier League</option>
      <option value="Championship">Championship</option>
      <option value="League One">League One</option>
      <option value="FA Cup">FA Cup</option>
      <option value="Copa Carabao">Copa Carabao</option>
      <option value="Serie A Italia">Serie A Italia</option>
      <option value="Serie B Italia">Serie B Italia</option>
      <option value="Bundesliga Alemania">Bundesliga Alemania</option>
      <option value="Bundesliga 2 Alemania">Bundesliga 2 Alemania</option>
      <option value="Ligue 1 Francia">Ligue 1 Francia</option>
      <option value="Ligue 2 Francia">Ligue 2 Francia</option>
      <option value="Primeira Liga Portugal">Primeira Liga Portugal</option>
      <option value="Segunda Liga Portugal">Segunda Liga Portugal</option>
      <option value="Brasileirão Serie A">Brasileirão Serie A</option>
      <option value="Brasileirão Serie B">Brasileirão Serie B</option>
      <option value="J-League Japón">J-League Japón</option>
      <option value="J2-League Japón">J2-League Japón</option>
      <option value="A-League Australia">A-League Australia</option>
      <option value="Champions League">Champions League</option>
      <option value="Europa League">Europa League</option>
      <option value="Conference League">Conference League</option>
      <option value="Champions Asiática">Champions Asiática</option>
      <option value="Copa Libertadores">Copa Libertadores</option>
      <option value="Copa Sudamericana">Copa Sudamericana</option>
      <option value="Copa Italia">Copa Italia</option>
      <option value="Copa Alemania">Copa Alemania</option>
      <option value="Copa Francia">Copa Francia</option>
      <option value="Copa Portugal">Copa Portugal</option>
    </select>

    <button onclick="generarPronosticosIA()">🚀 Analizar Liga y Publicar en la Web</button>
    <div id="loading" class="loading">⏳ La IA está consultando noticias, estado de forma, estadísticas de córners, tarjetas y remates... Por favor espera.</div>
    <div id="statusMsg"></div>

    <br>
    <a href="index.html" style="color: #38bdf8; text-decoration: none;">← Volver a la página pública</a>
  </div>
</div>

<script>
// Cambia aquí tu contraseña de administrador secreta
const CLAVE_SECRETA = "admin123"; 

function verificarLogin() {
  const pass = document.getElementById('adminPass').value;
  if (pass === CLAVE_SECRETA) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
  } else {
    alert("Contraseña incorrecta");
  }
}

async function generarPronosticosIA() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const liga = document.getElementById('ligaSelect').value;
  const loading = document.getElementById('loading');
  const msg = document.getElementById('statusMsg');

  if (!apiKey) {
    alert("Introduce tu API Key.");
    return;
  }

  loading.style.display = 'block';
  msg.innerHTML = '';

  const prompt = `Actúa como un tipster profesional experto en estadística avanzada de fútbol.
Busca los partidos más destacados de la competición "${liga}" para esta semana o próximos días.
Para cada partido, haz un análisis exhaustivo cruzando noticias recientes, estado de forma y estadísticas detalladas.
Devuelve un array JSON estricto con máximo 3 partidos que contenga exactamente esta estructura:
[
  {
    "partido": "Equipo A vs Equipo B",
    "liga": "${liga}",
    "fecha": "Fecha y hora",
    "analisis": "Resumen detallado de estado de forma, lesiones y contexto táctico...",
    "corners": "Más de 9.5 córners (Media combinada de 11.2)",
    "tarjetas": "Más de 4.5 tarjetas (Árbitro tarjetero y rivalidad alta)",
    "paradas": "Portero Local: Más de 3.5 paradas",
    "remates": "Delantero X: Más de 2.5 remates a puerta",
    "pickRecomendado": "Victoria Equipo A o Ambos Marcan",
    "cuota": "1.85",
    "resultadoExacto": "2-1",
    "handicap": "Equipo A (-0.75)",
    "stake": "4/5"
  }
]
Devuelve ÚNICAMENTE el JSON plano, sin bloques de código markdown.`;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        tools: [{ googleSearch: {} }]
      })
    });

    const data = await response.json();
    loading.style.display = 'none';

    if (data.candidates && data.candidates[0].content.parts[0].text) {
      let text = data.candidates[0].content.parts[0].text.trim();
      text = text.replace(/```json/g, '').replace(/```/g, '').trim();

      const nuevosPicks = JSON.parse(text);

      // Guardar en localStorage para que la web pública los muestre al instante
      let picksActuales = JSON.parse(localStorage.getItem('keeperstats_picks') || '[]');
      
      // Añadimos los nuevos al principio
      let combinados = [...nuevosPicks, ...picksActuales];
      localStorage.setItem('keeperstats_picks', JSON.stringify(combinados));

      msg.innerHTML = `<p class="success">¡Pronósticos de ${liga} generados y publicados con éxito en la web pública!</p>`;
    } else {
      msg.innerHTML = `<p style="color: #ef4444;">Error al procesar la respuesta de la IA.</p>`;
    }
  } catch (error) {
    loading.style.display = 'none';
    msg.innerHTML = `<p style="color: #ef4444;">Error de red: ${error.message}</p>`;
  }
}
</script>

</body>
</html>
