<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keeperstats VIP - Pronósticos Deportivos Automáticos</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131c2e;
      --text: #f1f5f9;
      --green: #22c55e;
      --gold: #eab308;
      --border: #1e293b;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 15px; text-align: center; }
    h1 { color: var(--green); margin: 0; font-size: 1.6em; }
    .subtitle { color: #94a3b8; font-size: 0.85em; margin-top: 4px; }
    .container { max-width: 900px; margin: 15px auto; padding: 0 12px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: var(--card); color: #94a3b8; font-size: 1em; }
    .tab.active-free { background: var(--green); color: #fff; }
    .tab.active-vip { background: var(--gold); color: #000; }

    .card { background: var(--card); border: 1px solid var(--border); border-left: 5px solid var(--green); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .card.vip { border-left-color: var(--gold); }
    .header-match { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .league { background: #1e293b; font-size: 0.75em; padding: 3px 8px; border-radius: 4px; color: #cbd5e1; }
    .teams { font-size: 1.2em; font-weight: bold; color: #38bdf8; }
    .analysis { font-size: 0.9em; line-height: 1.4; color: #cbd5e1; margin: 10px 0; background: #0b0f19; padding: 10px; border-radius: 6px; }
    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; font-size: 0.85em; margin: 10px 0; }
    .stat-item { background: #1e293b; padding: 6px 10px; border-radius: 4px; }
    .stat-item label { display: block; color: #94a3b8; font-size: 0.75em; }
    .pick-footer { background: #1e293b; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  </style>
</head>
<body>

<header>
  <h1>Scores24 AI VIP ⚽</h1>
  <div class="subtitle">Pronósticos Diarios Generados Automáticamente por Inteligencia Artificial</div>
</header>

<div class="container">
  <div class="tabs">
    <button id="btnFree" class="tab active-free" onclick="switchTab('free')">🎁 Picks Gratuitos</button>
    <button id="btnVip" class="tab" onclick="switchTab('vip')">👑 Picks Privados (VIP)</button>
  </div>

  <div id="content">Cargando pronósticos automáticos del día...</div>
</div>

<script>
let currentTab = 'free';
let allData = { free: [], vip: [] };

window.onload = async function() {
  try {
    // Lee el archivo generado diariamente por el bot autónomo
    const res = await fetch('data.json?v=' + Date.now());
    allData = await res.json();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML = `
      <div style="text-align:center; padding: 40px; color: #64748b;">
        <h3>⏳ Generando primeros datos automáticos...</h3>
        <p>El bot de Inteligencia Artificial está procesando la jornada de hoy. En unos minutos estarán disponibles.</p>
      </div>`;
  }
}

function switchTab(type) {
  currentTab = type;
  document.getElementById('btnFree').className = type === 'free' ? 'tab active-free' : 'tab';
  document.getElementById('btnVip').className = type === 'vip' ? 'tab active-vip' : 'tab';
  render();
}

function render() {
  const container = document.getElementById('content');
  const picks = currentTab === 'free' ? allData.free : allData.vip;

  if (!picks || picks.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:#64748b;">No hay pronósticos para esta sección hoy.</p>`;
    return;
  }

  container.innerHTML = '';
  picks.forEach(p => {
    const div = document.createElement('div');
    div.className = currentTab === 'vip' ? 'card vip' : 'card';
    div.innerHTML = `
      <div class="header-match">
        <span class="teams">⚽ ${p.partido}</span>
        <span class="league">${p.liga}</span>
      </div>
      <div style="font-size:0.8em; color:#94a3b8;">📅 ${p.fecha}</div>
      <div class="analysis"><strong>🧠 Análisis IA:</strong> ${p.analisis}</div>
      <div class="grid-stats">
        <div class="stat-item"><label>CÓRNERS</label>${p.corners}</div>
        <div class="stat-item"><label>TARJETAS</label>${p.tarjetas}</div>
        <div class="stat-item"><label>REMATES</label>${p.remates}</div>
        <div class="stat-item"><label>PARADAS</label>${p.paradas}</div>
      </div>
      <div class="pick-footer">
        <div><span style="font-size:0.75em; color:#94a3b8; display:block;">PRONÓSTICO</span><strong style="color:#22c55e;">${p.pick}</strong> (@${p.cuota})</div>
        <div><span style="font-size:0.75em; color:#94a3b8; display:block;">EXACTO / HANDICAP</span><span>${p.resultado}</span></div>
        <div><span style="font-size:0.75em; color:#94a3b8; display:block;">STAKE</span><span>${p.stake}</span></div>
      </div>
    `;
    container.appendChild(div);
  });
}
</script>

</body>
</html>
