<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Generador de Picks</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131c2e;
      --text-color: #f1f5f9;
      --accent-color: #22c55e;
      --border-color: #1e293b;
    }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input, select, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid var(--border-color); background: #0b0f19; color: #fff; box-sizing: border-box; }
    button { background-color: var(--accent-color); font-weight: bold; cursor: pointer; border: none; }
    button:hover { background-color: #16a34a; }
    .hidden { display: none; }
    .loading { text-align: center; color: #38bdf8; display: none; font-size: 1.1em; }
    .success { color: #22c55e; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔐 Panel de Control - Administrador</h1>

  <div id="loginBox" class="card">
    <h3>Contraseña de Admin</h3>
    <input type="password" id="adminPass" placeholder="Contraseña">
    <button onclick="verificarLogin()">Entrar</button>
  </div>

  <div id="adminPanel" class="card hidden">
    <h3>🤖 Generador de Pronósticos</h3>
    
    <label>Tipo de Publicación:</label>
    <select id="tipoPick">
      <option value="free">🎁 Pick Gratuito (Free)</option>
      <option value="vip">👑 Pick Privado (VIP)</option>
    </select>

    <label>Competición:</label>
    <select id="ligaSelect">
      <option value="LaLiga España">LaLiga España</option>
      <option value="Premier League">Premier League</option>
      <option value="Champions League">Champions League</option>
      <option value="Copa Libertadores">Copa Libertadores</option>
      <option value="Serie A Italia">Serie A Italia</option>
      <option value="Bundesliga Alemania">Bundesliga Alemania</option>
    </select>

    <label>Partido (Ej: Real Madrid vs Barcelona):</label>
    <input type="text" id="partidoInput" placeholder="Introduce los equipos del partido">

    <button onclick="generarPickManual()">🚀 Generar Análisis y Publicar</button>
    <div id="loading" class="loading">⏳ Analizando estado de forma, córners, tarjetas y estadísticas...</div>
    <div id="statusMsg"></div>

    <br>
    <a href="index.html" style="color: #38bdf8; text-decoration: none;">← Volver a la web pública</a>
  </div>
</div>

<script>
const CLAVE_SECRETA = "admin123";
const MI_API_KEY = "AQ.Ab8RN6IBHkbKInFaIbDPMw8Y6f7AbfZlWM_X7xMXurmGYlFRIQ";

function verificarLogin() {
  if (document.getElementById('adminPass').value === CLAVE_SECRETA) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
  } else {
    alert("Contraseña incorrecta");
  }
}

async function generarPickManual() {
  const partido = document.getElementById('partidoInput').value.trim();
  const liga = document.getElementById('ligaSelect').value;
  const tipo = document.getElementById('tipoPick').value;
  const loading = document.getElementById('loading');
  const msg = document.getElementById('statusMsg');

  if (!partido) {
    alert("Por favor escribe el partido.");
    return;
  }

  loading.style.display = 'block';
  msg.innerHTML = '';

  const prompt = `Actúa como tipster profesional. Haz un análisis estadístico avanzado para el partido "${partido}" de la competición "${liga}".
Devuelve la respuesta estructurada exactamente con este formato de texto plano (sin bloques json ni markdown):
ANÁLISIS: [Resumen de forma, bajas y contexto táctico]
PICK: [Apuesta recomendada principal]
CUOTA: [Cuota estimada ej: 1.85]
EXTRA: [Córners / Tarjetas / Remates estimados]
RESULTADO: [Resultado exacto o hándicap]
STAKE: [Stake ej: 3/5]`;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${MI_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await response.json();
    loading.style.display = 'none';

    if (data.candidates && data.candidates[0].content.parts[0].text) {
      let textoIA = data.candidates[0].content.parts[0].text;

      // Extraer datos limpiamente por líneas
      let nuevoPick = {
        partido: partido,
        liga: liga,
        fecha: "Próximo encuentro",
        analisis: extraerCampo(textoIA, "ANÁLISIS:"),
        pick: extraerCampo(textoIA, "PICK:"),
        cuota: extraerCampo(textoIA, "CUOTA:"),
        extra: extraerCampo(textoIA, "EXTRA:"),
        resultadoExacto: extraerCampo(textoIA, "RESULTADO:"),
        stake: extraerCampo(textoIA, "STAKE:")
      };

      const storageKey = tipo === 'free' ? 'keeperstats_free' : 'keeperstats_vip';
      let actual = JSON.parse(localStorage.getItem(storageKey) || '[]');
      actual.unshift(nuevoPick);
      localStorage.setItem(storageKey, JSON.stringify(actual));

      msg.innerHTML = `<p class="success">¡Pronóstico ${tipo.toUpperCase()} publicado con éxito!</p>`;
      document.getElementById('partidoInput').value = '';
    } else {
      msg.innerHTML = `<p style="color: #ef4444;">Error al generar el pronóstico.</p>`;
    }
  } catch (error) {
    loading.style.display = 'none';
    msg.innerHTML = `<p style="color: #ef4444;">Error de red: ${error.message}</p>`;
  }
}

function extraerCampo(texto, clave) {
  let pos = texto.indexOf(clave);
  if (pos === -1) return "Disponible en análisis";
  let inicio = pos + clave.length;
  let fin = texto.indexOf('\n', inicio);
  if (fin === -1) fin = texto.length;
  return texto.substring(inicio, fin).trim();
}
</script>

</body>
</html>
